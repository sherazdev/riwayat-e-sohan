<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin Dashboard | Riwaayat-e-Sohan</title>
    <style>
        :root {
            font-family: Inter, system-ui, Segoe UI, Arial, sans-serif;
            color: #35272a;
            background: #f8f5f0
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0
        }

        header {
            background: #57172b;
            color: #fff;
            padding: 22px clamp(20px, 5vw, 80px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            box-shadow: 0 5px 24px #46152625
        }

        header h1 {
            font-family: Georgia, serif;
            font-size: 25px;
            margin: 0;
            letter-spacing: .2px
        }

        header small {
            display: block;
            color: #d9b77b;
            font-size: 11px;
            letter-spacing: 2px;
            margin-top: 5px
        }

        main {
            max-width: 1350px;
            margin: auto;
            padding: 36px 24px 80px
        }

        button,
        input,
        select {
            font: inherit;
            border-radius: 10px;
            padding: 11px 14px;
            border: 1px solid #e5d9d0
        }

        button {
            background: #651b2c;
            color: white;
            border: 0;
            cursor: pointer;
            font-weight: 600
        }

        button:hover {
            filter: brightness(1.12)
        }

        button.secondary {
            background: white;
            color: #651b2c;
            border: 1px solid #d9c3c7
        }

        input {
            max-width: 100%
        }

        .hidden {
            display: none !important
        }

        .login {
            max-width: 440px;
            margin: 75px auto;
            background: white;
            border: 1px solid #e9ded6;
            border-radius: 22px;
            padding: 38px;
            box-shadow: 0 18px 60px #57202b12
        }

        .login input {
            width: 100%;
            margin: 14px 0
        }

        .topline {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap
        }

        .topline h2 {
            font-family: Georgia, serif;
            font-size: 32px;
            margin: 0
        }

        .topline button {
            margin-left: 5px
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
            gap: 17px;
            margin: 30px 0 42px
        }

        .metric {
            background: #fff;
            border: 1px solid #ebdfd6;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 8px 25px #3b1c2109;
            position: relative;
            overflow: hidden
        }

        .metric:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #651b2c, #d8ad68)
        }

        .metric small {
            display: block;
            color: #89787b;
            font-size: 13px;
            font-weight: 600
        }

        .metric strong {
            display: block;
            font-size: 38px;
            color: #651b2c;
            margin-top: 12px;
            letter-spacing: -1px
        }

        .order {
            background: white;
            border: 1px solid #eaded5;
            border-radius: 17px;
            padding: 24px;
            margin: 15px 0;
            box-shadow: 0 8px 24px #3b1c2108;
            overflow-wrap: anywhere
        }

        .order h3 {
            margin: 0 0 10px;
            color: #651b2c;
            font-size: 20px
        }

        .order p {
            margin: 9px 0;
            line-height: 1.5
        }

        .order .status {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #f0e8e1
        }

        .order label {
            display: grid;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            color: #74666a
        }

        .order select {
            max-width: 250px;
            background: #fff
        }

        .sub {
            color: #8b7979;
            font-size: 14px
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0
        }

        .toolbar input {
            flex: 1;
            min-width: 190px;
            background: #fff
        }

        .toolbar select {
            background: #fff
        }

        .error {
            color: #b52640
        }

        .section-title {
            font-family: Georgia, serif;
            font-size: 25px;
            color: #4e2330;
            margin: 0
        }

        ul {
            padding-left: 20px
        }

        li {
            margin: 7px 0
        }

        footer {
            padding: 25px;
            text-align: center;
            color: #8a7979;
            font-size: 12px
        }

        .toast {
            position: fixed;
            right: 24px;
            top: 95px;
            z-index: 50;
            background: white;
            border: 1px solid #e4c8a3;
            border-left: 6px solid #b98b43;
            box-shadow: 0 20px 65px #3b18284a;
            border-radius: 16px;
            padding: 20px;
            width: min(370px, calc(100vw - 40px))
        }

        .toast h3 {
            color: #651b2c;
            margin: 0 0 8px
        }

        .toast p {
            line-height: 1.5
        }

        .toast button {
            margin-right: 8px
        }

        .dot {
            background: #f4d38c;
            color: #5d1d2d;
            padding: 4px 9px;
            border-radius: 30px;
            font-size: 12px
        }

        #newCount {
            margin-left: 6px
        }

        @media(max-width:600px) {
            main {
                padding: 22px 14px
            }

            .topline h2 {
                font-size: 26px
            }

            header h1 {
                font-size: 20px
            }

            .login {
                margin: 30px auto;
                padding: 25px
            }

            .cards {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px
            }

            .metric {
                padding: 16px
            }

            .metric strong {
                font-size: 29px
            }

            .toast {
                top: 70px;
                right: 10px
            }
        }

        /* Premium order tiles and detail dialog */
        #orders {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr));
            gap: 18px;
            align-items: start
        }

        .order-tile {
            background: #fff;
            border: 1px solid #eadad0;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 28px #4a18230d
        }

        .order-tile-head {
            background: linear-gradient(120deg, #651b2c, #8a2a43);
            color: #fff;
            padding: 19px 21px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px
        }

        .order-tile-head strong {
            font-size: 21px
        }

        .order-tile-head small {
            display: block;
            margin-top: 5px;
            color: #f2d6c8
        }

        .order-tile-body {
            padding: 19px 21px
        }

        .order-tile-body p {
            margin: 9px 0;
            line-height: 1.45
        }

        .order-tile .amount {
            font-size: 23px;
            font-weight: 800;
            color: #651b2c
        }

        .tile-status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 100px;
            background: #f9e7cb;
            color: #68361a;
            font-size: 12px;
            font-weight: 700
        }

        .tile-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 16px
        }

        .tile-actions button {
            flex: 1;
            white-space: nowrap
        }

        .order-dialog {
            border: 0;
            border-radius: 22px;
            width: min(1050px, calc(100% - 22px));
            max-height: 90vh;
            padding: 0;
            box-shadow: 0 35px 100px #230b1c66;
            color: #34242b
        }

        .order-dialog::backdrop {
            background: #210d16b0
        }

        .detail-head {
            background: linear-gradient(110deg, #5c1428, #8e2946);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center
        }

        .detail-head h2 {
            margin: 0;
            font-size: 27px
        }

        .detail-head p {
            margin: 6px 0 0;
            color: #f2d7d8
        }

        .detail-close {
            background: #ffffff22;
            border: 1px solid #ffffff55;
            font-size: 21px;
            padding: 7px 13px
        }

        .detail-content {
            padding: 25px 28px 30px;
            background: #fffdfa
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 18px
        }

        .detail-stat,
        .detail-section {
            border: 1px solid #e7d5c6;
            border-radius: 14px;
            background: #fff;
            padding: 16px
        }

        .detail-stat small {
            display: block;
            color: #8c6d68;
            margin-bottom: 7px
        }

        .detail-stat strong {
            font-size: 18px;
            overflow-wrap: anywhere;
            color: #5f1a2e
        }

        .detail-columns {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 16px
        }

        .detail-section {
            margin-bottom: 15px
        }

        .detail-section h3 {
            margin: 0 0 13px;
            color: #641c30;
            font-size: 18px
        }

        .detail-section p {
            line-height: 1.55;
            overflow-wrap: anywhere
        }

        .detail-table {
            width: 100%;
            border-collapse: collapse
        }

        .detail-table th,
        .detail-table td {
            text-align: left;
            padding: 12px 8px;
            border-bottom: 1px solid #eaded4
        }

        .detail-table th {
            background: #f6e8df;
            color: #651b2c;
            font-size: 13px
        }

        .detail-table td:last-child,
        .detail-table th:last-child {
            text-align: right
        }

        .detail-total {
            display: flex;
            justify-content: space-between;
            background: #fff0cf;
            padding: 14px;
            border-radius: 10px;
            font-size: 19px;
            font-weight: 800;
            color: #651b2c;
            margin-top: 15px
        }

        .detail-bottom {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            align-items: end;
            padding-top: 16px;
            border-top: 1px solid #eaded4
        }

        .detail-bottom .status {
            display: flex;
            flex-wrap: wrap;
            gap: 14px
        }

        .detail-bottom label {
            display: grid;
            gap: 7px;
            font-size: 12px;
            color: #6f565b;
            font-weight: 700
        }

        .detail-bottom select {
            max-width: 245px
        }

        .detail-print-actions {
            display: flex;
            gap: 9px;
            flex-wrap: wrap
        }

        .detail-print-actions button {
            white-space: nowrap
        }

        @media(max-width:800px) {
            .detail-grid {
                grid-template-columns: repeat(2, 1fr)
            }

            .detail-columns {
                grid-template-columns: 1fr
            }

            .detail-content {
                padding: 15px
            }

            .detail-head {
                padding: 20px
            }
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1>✦ Riwaayat-e-Sohan</h1><small>PRIVATE BUSINESS CONTROL CENTER</small>
        </div><span style="color:#e5c58b">ADMIN PANEL</span>
    </header>
    <main>
        <section id="login" class="login">
            <h2>Welcome Back</h2>
            <p class="sub">Sign in to manage your store securely.</p>
            <form id="loginForm"><label for="password">Admin password</label><input id="password" type="password"
                    required autocomplete="current-password"><button type="submit">Secure Login →</button></form>
            <p id="loginError" class="error" role="alert"></p>
        </section>
        <section id="dashboard" class="hidden">
            <div class="topline">
                <div>
                    <p class="sub" style="color:#a57d43;font-weight:700;letter-spacing:2px">STORE ANALYTICS</p>
                    <h2>Business Overview <span id="newCount" class="dot hidden">0</span></h2>
                    <p class="sub">Orders, payments and website activity</p>
                </div>
                <div><button class="secondary" id="soundToggle">🔕 Enable Sound</button><button class="secondary"
                        id="refresh">↻ Refresh</button><button id="logout">Logout</button></div>
            </div>
            <div class="cards" id="metrics"></div>
            <h2 class="section-title">Customer Orders</h2>
            <div class="toolbar"><input id="search" placeholder="Search order number, customer, phone or city"><select
                    id="filter">
                    <option value="all">All orders</option>
                    <option value="pending">Pending orders</option>
                    <option value="payment">Payment pending</option>
                    <option value="paid">Paid</option>
                    <option value="delivered">Delivered</option>
                </select></div>
            <p id="status" class="sub"></p>
            <div id="orders"></div>
        </section>
    </main>
    <dialog id="orderDialog" class="order-dialog" aria-label="Order details">
        <div id="detailMount"></div>
    </dialog>
    <aside id="toast" class="toast hidden" role="status">
        <h3>🔔 New Order Received!</h3>
        <p id="toastText"></p><button id="toastView">View Orders</button><button class="secondary"
            id="toastClose">Dismiss</button>
    </aside>
    <footer>© Riwaayat-e-Sohan · Private Administration</footer>
    <script>
        const $ = id => document.getElementById(id); let orders = []; let knownIds = new Set(); let initialized = false; let soundEnabled = false; let audioContext = null; const el = (tag, text) => {const n = document.createElement(tag); n.textContent = String(text ?? ''); return n}; const money = n => 'Rs. ' + Number(n || 0).toLocaleString('en-PK'); async function api(url, options = {}) {const r = await fetch(url, {credentials: 'same-origin', ...options}); const d = await r.json(); if (!r.ok) throw Error(d.error || 'Request failed'); return d} function show(logged) {$('login').classList.toggle('hidden', logged); $('dashboard').classList.toggle('hidden', !logged)} $('loginForm').onsubmit = async e => {e.preventDefault(); $('loginError').textContent = ''; try {await api('/api/admin/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({password: $('password').value})}); $('password').value = ''; show(true); await load()} catch (e) {$('loginError').textContent = e.message} }; $('logout').onclick = async () => {await api('/api/admin/logout', {method: 'POST'}); show(false); $('orders').replaceChildren(); initialized = false; knownIds.clear()}; $('refresh').onclick = load;
        $('soundToggle').onclick = async () => {soundEnabled = !soundEnabled; if (soundEnabled) {audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)(); await audioContext.resume(); chime()} $('soundToggle').textContent = soundEnabled ? '🔔 Sound On' : '🔕 Enable Sound'};
        function chime() {if (!soundEnabled || !audioContext) return; const now = audioContext.currentTime;[659.25, 880, 1046.5].forEach((freq, i) => {const osc = audioContext.createOscillator(), gain = audioContext.createGain(); osc.type = 'sine'; osc.frequency.value = freq; gain.gain.setValueAtTime(.0001, now + i * .16); gain.gain.exponentialRampToValueAtTime(.12, now + i * .16 + .025); gain.gain.exponentialRampToValueAtTime(.0001, now + i * .16 + .65); osc.connect(gain); gain.connect(audioContext.destination); osc.start(now + i * .16); osc.stop(now + i * .16 + .68)})}
        function announce(newOrders) {if (!newOrders.length) return; chime(); const o = newOrders[0]; $('toastText').textContent = (newOrders.length > 1 ? newOrders.length + ' new orders! ' : o.id + ' · ') + o.customer.name + ' · ' + o.totalKg + ' KG'; $('toast').classList.remove('hidden'); $('newCount').textContent = String(newOrders.length); $('newCount').classList.remove('hidden')}
        $('toastClose').onclick = () => {$('toast').classList.add('hidden'); $('newCount').classList.add('hidden')}; $('toastView').onclick = () => {$('toast').classList.add('hidden'); $('search').value = ''; $('filter').value = 'all'; render(); $('orders').scrollIntoView({behavior: 'smooth'})};
        setInterval(() => {if (!$('dashboard').classList.contains('hidden') && document.visibilityState === 'visible') load()}, 8000);
        $('search').oninput = render; $('filter').onchange = render; function metric(label, value) {const b = el('div', ''); b.className = 'metric'; b.append(el('small', label), el('strong', value)); return b} async function load() {try {const [s, o] = await Promise.all([api('/api/admin/summary'), api('/api/admin/orders')]); orders = o.orders; const fresh = initialized ? orders.filter(x => !knownIds.has(x.id)) : []; knownIds = new Set(orders.map(x => x.id)); initialized = true; if (fresh.length) announce(fresh); $('metrics').replaceChildren(metric('Total Orders', s.totalOrders), metric('Pending Orders', s.pendingOrders), metric('Payment Pending', s.paymentPending), metric('Paid Orders', s.paidOrders), metric('Unique Visitors', s.uniqueVisitors), metric('Visitors Today', s.visitorsToday), metric('Visitors Last 7 Days', s.visitorsLast7Days), metric('Customers Who Ordered', s.customers)); render()} catch (e) {if (e.message.includes('login')) show(false); $('status').textContent = e.message} } function select(label, values, current, handler) {const w = el('label', label), s = document.createElement('select'); for (const v of values) {const o = document.createElement('option'); o.value = v; o.textContent = v; s.append(o)} s.value = current; s.onchange = () => handler(s.value); w.append(s); return w} async function update(id, field, value) {try {await api('/api/admin/orders/' + encodeURIComponent(id), {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({[field]: value})}); await load()} catch (e) {alert(e.message)} } function detailNode(tag, text, className) {const n = el(tag, text); if (className) n.className = className; return n}
        function appendTextRow(parent, label, value) {const p = el('p', ''); p.append(el('strong', label + ': '), document.createTextNode(String(value ?? ''))); parent.append(p)}
        function statusFields(order) {const row = detailNode('div', '', 'status'); row.append(select('Order Status', ['New — awaiting confirmation', 'Confirmed', 'Packing', 'Dispatched', 'Delivered', 'Cancelled'], order.status, v => update(order.id, 'status', v)), select('Payment Status', ['Not paid', 'Awaiting verification', 'Paid', 'Refunded'], order.paymentStatus, v => update(order.id, 'paymentStatus', v))); return row}
        function openDetail(id) {const o = orders.find(x => x.id === id); if (!o) return; const m = $('detailMount'); m.replaceChildren(); const h = detailNode('div', '', 'detail-head'), headText = el('div', ''); headText.append(el('h2', 'Order #' + o.id), el('p', new Date(o.createdAt).toLocaleString())); const close = detailNode('button', '×', 'detail-close'); close.setAttribute('aria-label', 'Close order details'); close.onclick = () => $('orderDialog').close(); h.append(headText, close); m.append(h); const content = detailNode('div', '', 'detail-content'), stats = detailNode('div', '', 'detail-grid'); for (const [label, value] of [['Customer', o.customer.name], ['Phone', o.customer.phone], ['Total Weight', o.totalKg + ' KG'], ['Order Amount', money(o.productSubtotal)]]) {const b = detailNode('div', '', 'detail-stat'); b.append(el('small', label), el('strong', value)); stats.append(b)} content.append(stats); const columns = detailNode('div', '', 'detail-columns'), left = el('div', ''), right = el('div', ''), address = detailNode('section', '', 'detail-section'); address.append(el('h3', 'Delivery Address')); appendTextRow(address, 'Address', o.customer.address); appendTextRow(address, 'City', o.customer.city); if (o.customer.postal) appendTextRow(address, 'Postal Code', o.customer.postal); left.append(address); const notes = detailNode('section', '', 'detail-section'); notes.append(el('h3', 'Order Notes'), el('p', o.customer.notes || 'No special instructions')); left.append(notes); const items = detailNode('section', '', 'detail-section'); items.append(el('h3', 'Order Items')); const table = detailNode('table', '', 'detail-table'), thead = el('thead', ''), tr = el('tr', ''); for (const label of ['Product', 'Weight', 'Price']) tr.append(el('th', label)); thead.append(tr); const tbody = el('tbody', ''); for (const i of o.items) {const row = el('tr', ''); row.append(el('td', i.name), el('td', i.qtyKg + ' KG'), el('td', money(i.lineTotal))); tbody.append(row)} table.append(thead, tbody); items.append(table); appendTextRow(items, 'TCS Delivery', 'Included in product prices'); const total = detailNode('div', '', 'detail-total'); total.append(el('span', 'Total Amount'), el('span', money(o.productSubtotal))); items.append(total); right.append(items); columns.append(left, right); content.append(columns); const bottom = detailNode('div', '', 'detail-bottom'); bottom.append(statusFields(o)); const actions = detailNode('div', '', 'detail-print-actions'); const invoice = el('button', 'Print Customer Invoice'), packing = detailNode('button', 'Print TCS Packing Slip', 'secondary'); invoice.onclick = () => printOrder(o, 'invoice'); packing.onclick = () => printOrder(o, 'packing'); actions.append(invoice, packing); bottom.append(actions); content.append(bottom); m.append(content); $('orderDialog').showModal()}
        function printOrder(o, kind) {const isInvoice = kind === 'invoice'; const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c])); const rows = o.items.map((i, n) => `<tr><td>${n + 1}</td><td>${esc(i.name)}</td><td>${esc(i.qtyKg)} KG</td>${isInvoice ? `<td>${esc(money(i.lineTotal))}</td>` : ''}</tr>`).join(''); const html = `<!doctype html><html><head><meta charset="utf-8"><title>${isInvoice ? 'Customer Invoice' : 'TCS Packing Slip'} - ${esc(o.id)}</title><style>@page{size:A4;margin:15mm}*{box-sizing:border-box}body{font:13px Arial,sans-serif;color:#33242a;margin:0}header{background:#68172f;color:#fff;padding:22px;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}header h1{font:32px Georgia,serif;margin:0;color:#f5d48b}header p{margin:8px 0 0;letter-spacing:2px;font-size:11px}.wrap{padding:23px 8px}.heading{display:flex;justify-content:space-between;gap:15px;align-items:start;border-bottom:2px solid #6b1c31;padding-bottom:15px;margin-bottom:18px}h2{color:#651b2c;margin:0 0 8px;font-size:22px}.boxrow{display:flex;gap:15px;margin:18px 0}.box{border:1px solid #ddcbbd;border-radius:10px;padding:15px;flex:1;min-width:0;overflow-wrap:anywhere}.box h3{margin:0 0 12px;color:#651b2c;font-size:15px}.box p{margin:8px 0;line-height:1.45}table{width:100%;border-collapse:collapse;margin-top:12px}th{background:#f5e8dc;color:#651b2c;text-align:left}td,th{padding:12px 9px;border-bottom:1px solid #e7dbd1}td:last-child,th:last-child{text-align:right}.total{background:#f9ebc9;padding:13px;margin-top:14px;text-align:right;color:#651b2c;font-size:19px;font-weight:bold}.footer{text-align:center;margin-top:34px;border-top:1px solid #c69d5c;padding-top:16px;color:#6a4b4e}p{overflow-wrap:anywhere}@media print{.no-print{display:none}}@media screen{body{max-width:800px;margin:20px auto;border:1px solid #ddd}.no-print{text-align:right;padding:10px}}</style></head><body><div class="no-print"><button onclick="window.print()">Print / Save as PDF</button></div><header><h1>Riwaayat-e-Sohan</h1><p>MULTANI SOHAN HALWA</p></header><div class="wrap"><div class="heading"><div><h2>${isInvoice ? 'Customer Invoice' : 'TCS Packing Slip'}</h2><strong>Order #${esc(o.id)}</strong><p>${esc(new Date(o.createdAt).toLocaleString())}</p></div><div><p>Order: <strong>${esc(o.status)}</strong></p>${isInvoice ? `<p>Payment: <strong>${esc(o.paymentStatus)}</strong></p>` : ''}</div></div><div class="boxrow"><div class="box"><h3>Customer Details</h3><p><strong>Name:</strong> ${esc(o.customer.name)}</p><p><strong>Phone:</strong> ${esc(o.customer.phone)}</p></div><div class="box"><h3>Delivery Address</h3><p>${esc(o.customer.address)}</p><p>${esc(o.customer.city)} ${esc(o.customer.postal || '')}</p></div></div><div class="box"><h3>Order Items</h3><table><thead><tr><th>#</th><th>Product</th><th>Weight</th>${isInvoice ? '<th>Price</th>' : ''}</tr></thead><tbody>${rows}</tbody></table><p><strong>Total Weight:</strong> ${esc(o.totalKg)} KG</p>${isInvoice ? `<p><strong>TCS Delivery:</strong> Included</p><div class="total">Total Amount: ${esc(money(o.productSubtotal))}</div>` : ''}</div>${o.customer.notes ? `<div class="box" style="margin-top:15px"><h3>Order Notes</h3><p>${esc(o.customer.notes)}</p></div>` : ''}<div class="footer">${isInvoice ? 'Thank you for choosing Riwaayat-e-Sohan!' : 'Please verify recipient details before dispatch.'}</div></div></body></html>`; const w = window.open('', '_blank'); if (!w) {alert('Please allow pop-ups to print this order.'); return } w.document.open(); w.document.write(html); w.document.close(); w.focus()}
        function render() {const term = $('search').value.trim().toLowerCase(), f = $('filter').value; const filtered = orders.filter(o => {if (term && !([o.id, o.customer.name, o.customer.phone, o.customer.city].join(' ').toLowerCase().includes(term))) return false; if (f === 'pending') return !['Delivered', 'Cancelled'].includes(o.status); if (f === 'payment') return o.paymentStatus !== 'Paid'; if (f === 'paid') return o.paymentStatus === 'Paid'; if (f === 'delivered') return o.status === 'Delivered'; return true}); $('status').textContent = filtered.length + ' order(s)'; $('orders').replaceChildren(); for (const o of filtered) {const card = detailNode('article', '', 'order-tile'), head = detailNode('div', '', 'order-tile-head'), heading = el('div', ''); heading.append(el('strong', o.id), el('small', new Date(o.createdAt).toLocaleString())); head.append(heading, detailNode('span', o.paymentStatus, 'tile-status')); const body = detailNode('div', '', 'order-tile-body'); body.append(el('h3', o.customer.name), el('p', '☎ ' + o.customer.phone), el('p', '📍 ' + o.customer.city), el('p', '⚖ ' + o.totalKg + ' KG · ' + o.items.length + ' product(s)'), detailNode('div', money(o.productSubtotal), 'amount')); const actions = detailNode('div', '', 'tile-actions'), view = el('button', 'View Details'), print = detailNode('button', 'Print Invoice', 'secondary'); view.onclick = () => openDetail(o.id); print.onclick = () => printOrder(o, 'invoice'); actions.append(view, print); body.append(actions); card.append(head, body); $('orders').append(card)} }
        api('/api/admin/summary').then(() => {show(true); load()}).catch(() => show(false));
